configuration:
  log_level:
    name: Уровень логирования
    description: Насколько подробно шлюз пишет в журнал приложения. Токены, ключи и тексты запросов он не пишет никогда.
  websocket:
    name: Держать соединение с OpenAI открытым
    description: Через постоянное WebSocket-соединение ответы начинаются примерно на 0,7 с раньше. Выключите, чтобы каждый ответ шёл отдельным HTTP-запросом, если с соединением что-то не так.
network:
  8780/tcp: OpenAI-совместимый API для клиентов в вашей сети; приложениям внутри Home Assistant (FlowPilot) он не нужен.
